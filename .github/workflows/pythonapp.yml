# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  # automatically cancel the previously triggered workflows when there's a newer version
  group: build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04  # fork harness: pin (ubuntu-26.04 breaks the rm -rf hostedtoolcache install)
    env:
      MONAI_ZOO_AUTH_TOKEN: ${{ github.token }}
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          rm -rf /opt/hostedtoolcache
          sudo apt-get install openslide-tools -y
          python -m pip install --upgrade pip wheel
          pip install -r requirements-dev.txt
      - name: Clean
        run: |
          $(pwd)/runtests.sh --clean
      - name: PyType
        # NOTE: pytype is currently a no-op in CI (see issue #1917). The echo is
        # intentional until the pre-existing pytype errors are triaged.
        run: |
          echo $(pwd)/runtests.sh --pytype
      - name: Unit Tests
        run: |
          $(pwd)/runtests.sh --unittests
